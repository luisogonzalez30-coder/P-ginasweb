<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arredondo Estudio & Diseño — Carpintería Nativa • Chile</title>
<meta name="description" content="Muebles de madera nativa hechos a tu medida. Diseña el tuyo en 3D. Envío gratis a todo Chile y pago con Mercado Pago.">
<meta name="theme-color" content="#0d0a07">
<meta property="og:title" content="Arredondo Estudio & Diseño — Carpintería Nativa">
<meta property="og:description" content="Aparadores, racks flotantes y muebles de TV en madera nativa. Diséñalos en 3D.">
<meta property="og:image" content="img/portada.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="preload" as="image" href="img/portada.jpg">
<link rel="stylesheet" href="css/cuenta.css">
</head>
<body>
  <div class="cover"><img id="coverImg" src="img/portada.jpg" alt="Arredondo Estudio & Diseño — Carpintería Nativa • Chile" fetchpriority="high"></div>
  <div class="shade"></div>

  <a class="skip" href="tienda.html">Saltar intro</a>

  <div class="cta-wrap">
    <a id="enter" class="cta" href="tienda.html">
      Entrar a la colección
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="perks"><span><b>◆</b> Envío gratis</span><span><b>◆</b> Mercado Pago</span><span><b>◆</b> Diseño 3D a medida</span></p>
  </div>
  <div id="curtain"></div>

  <script>
    (function () {
      var enter = document.getElementById('enter'), curtain = document.getElementById('curtain'), img = document.getElementById('coverImg'), done = false;
      function go(e) {
        if (e) e.preventDefault(); if (done) return; done = true;
        img.classList.add('zoom'); curtain.classList.add('on');
        setTimeout(function () { location.href = 'tienda.html'; }, 900);
      }
      enter.addEventListener('click', go);
      document.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(e); });
    })();
  </script>
<script src="js/config.js"></script>
<script src="js/cuenta.js" defer></script>
</body>
</html>
